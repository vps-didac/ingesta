services:
  ingesta:
    build: .
    container_name: ingesta
    restart: unless-stopped
    # uid del contenedor del MCP: ya es el que crea y escribe la BD en el volumen
    user: "1000:1000"
    # Solo sale a Internet (Hevy y Garmin); no escucha en ningún puerto.
    network_mode: host
    mem_limit: 256m

    environment:
      TZ: Europe/Madrid            # a qué día pertenece un entreno y qué es "hoy"
      DB_PATH: /data/personal_data.db
      # Franjas fijas (Hevy + Garmin). Ver ingest/agenda.py
      INGEST_HORAS: "09:00,12:00,17:00,22:00"
      # Tras la primera franja, sin el sueño de hoy: Garmin cada 15 min, o cada 60 si
      # ya hay uso de esa madrugada (>= 1500 pasos: el reloj sube datos pero no la noche)
      INGEST_REINTENTO_MIN: "15"
      INGEST_REINTENTO_USO_MIN: "60"
      INGEST_PASOS_USO: "1500"
      GARMIN_TOKENSTORE: /data/garmin_tokens
      HOME: /tmp                   # que ninguna librería intente escribir en /

    # HEVY_API_KEY, GARMIN_EMAIL, GARMIN_PASSWORD. Archivo sin seguimiento, solo en el VPS.
    env_file:
      - secrets.env

    # La misma carpeta que monta el MCP (vps-didac/mcp-server) en /data. Él solo lee.
    volumes:
      - /home/ubuntu/apps/lab-ai/data:/data
