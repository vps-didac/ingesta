services:
  app:
    build: .
    container_name: CAMBIAME            # mismo nombre que el repo, va bien
    restart: unless-stopped

    # host = el contenedor comparte la red del VPS y el servicio queda en
    # 127.0.0.1:8000 / tailnet. Si prefieres aislarlo, quita esta línea y
    # descomenta el bloque ports.
    network_mode: host
    # ports:
    #   - "127.0.0.1:8000:8000"

    mem_limit: 256m

    environment:
      PORT: "8000"

    # Secretos: archivo sin seguimiento junto a este compose, solo en el VPS.
    # Lo lee docker compose en el host y al contenedor solo le llegan las
    # variables. No lo llames .env: hay librerías que auto-parsean cualquier
    # .env que encuentren en el directorio de trabajo.
    env_file:
      - secrets.env

    # volumes:
    #   - /home/ubuntu/apps/datos/CAMBIAME:/datos
